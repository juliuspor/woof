[package]
name = "woof"
version.workspace = true
description = "Privacy-first local macOS memory companion"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "woof"

[lib]
name = "woof_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "woof"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
chrono.workspace = true
dirs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.10.3", default-features = false, features = ["wry", "image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-shell = "=2.3.5"
tokio.workspace = true
url.workspace = true
uuid.workspace = true
woof-core = { path = "../../../crates/woof-core" }
woof-audio = { path = "../../../crates/woof-audio" }
woof-capture = { path = "../../../crates/woof-capture" }
woof-inline = { path = "../../../crates/woof-inline" }
woof-llm = { path = "../../../crates/woof-llm" }
global-hotkey = "=0.7.0"
libc.workspace = true
window-vibrancy = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSAnimation",
  "NSAnimationContext",
  "NSColor",
  "NSEvent",
  "NSPanel",
  "NSRunningApplication",
  "NSScreen",
  "NSSound",
  "NSTrackingArea",
  "NSVisualEffectView",
  "NSWindow",
] }
objc2-foundation = "0.3.2"
